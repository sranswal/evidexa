[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidexa"
version = "0.1.0"
description = "EVIDEXA — Intelligent document forensics and evidence analysis, powered by AI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13.1",
    "python-multipart>=0.0.9",
    "pikepdf>=9.0",
    "pypdf>=5.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "pypdfium2==5.15.0",
    "rapidocr-onnxruntime==1.4.4",
    "onnxruntime==1.31.1",
    "pdf-forensics-kit @ git+https://github.com/overjoyde/pdf-forensics-kit.git@d997e87cacf02812d647c873ca16fe8c5b055938",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "upstream",
    "data",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
packages = ["document_intelligence"]
mypy_path = "src"
exclude = [
    "^upstream/",
    "^data/",
]

[[tool.mypy.overrides]]
module = ["alembic.*", "pdfforensics.*", "pikepdf.*", "pypdfium2", "pypdfium2.*", "cv2", "cv2.*", "PIL.*"]
ignore_missing_imports = true
